<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veyra — AI Tenant Communications</title>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap");
<style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap");
*{margin:0;padding:0;box-sizing:border-box}
:root{--emerald:#059669;--emerald-light:rgba(5,150,105,0.15);--emerald-border:rgba(5,150,105,0.5);--card-bg:linear-gradient(160deg, rgba(11,18,15,0.9), rgba(12,24,19,0.74) 50%, rgba(9,14,12,0.92));--card-border:rgba(128,205,179,0.16);--card-border-hover:rgba(128,205,179,0.28);--card-shadow:0 18px 50px rgba(0,0,0,0.35), 0 0 38px rgba(39,122,101,0.08), inset 0 1px 0 rgba(255,255,255,0.08);--text-heading:#ffffff;--text-body:rgba(255,255,255,0.7);--text-muted:rgba(255,255,255,0.5);--bg:#0a0f0a;--green:#059669;--red:#DC2626}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text-body);min-height:100vh;display:flex;flex-direction:column}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 50% -20%, rgba(5,150,105,0.08), transparent),repeating-linear-gradient(0deg,transparent,transparent 95px,rgba(65,159,132,0.009) 95px,rgba(65,159,132,0.009) 96px),repeating-linear-gradient(90deg,transparent,transparent 95px,rgba(65,159,132,0.009) 95px,rgba(65,159,132,0.009) 96px);pointer-events:none;z-index:0}
/* Header */
.header{background:linear-gradient(160deg, rgba(11,18,15,0.95), rgba(12,24,19,0.85));border-bottom:1px solid var(--card-border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(16px)}
.logo{display:flex;align-items:baseline;gap:2px;font-size:22px;font-weight:800;letter-spacing:2px}
.logo .v{color:var(--emerald)}.logo .eyra{color:#fff}
.logo-group{font-size:11px;font-weight:400;letter-spacing:3px;color:rgba(255,255,255,0.4);margin-left:10px}
.header-right{display:flex;align-items:center;gap:16px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--emerald);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
.pm-name{font-size:14px;color:var(--text-muted)}
.btn{padding:8px 18px;border-radius:9999px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .2s}
.btn-primary{background:linear-gradient(180deg, rgba(16,45,34,0.72), rgba(8,20,15,0.78));border:1.2px solid var(--emerald-border);color:var(--emerald)}.btn-primary:hover{color:#fff}
.btn-outline{background:transparent;color:var(--emerald);border:1.2px solid var(--emerald-border)}.btn-outline:hover{color:#fff;border-color:var(--card-border-hover)}
.btn-green{background:var(--emerald);color:#fff;border:none}.btn-green:hover{background:#047857}
.btn-sm{padding:6px 14px;font-size:13px}
/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:20px 24px;border-bottom:1px solid var(--card-border);position:relative;z-index:2}
.stat{text-align:center}
.stat-value{font-size:28px;font-weight:700;color:var(--text-heading)}
.stat-label{font-size:12px;color:var(--text-muted);margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
/* Main */
.main{flex:1;display:flex;max-width:1400px;width:100%;margin:0 auto;padding:20px 24px;gap:20px;position:relative;z-index:2}
.inbox{flex:1;min-width:0}
.inbox-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.inbox-header h2{font-size:18px;font-weight:700;color:var(--text-heading)}
.inbox-count{background:var(--emerald);color:#fff;border-radius:20px;padding:2px 10px;font-size:13px;font-weight:600;margin-left:8px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filter{padding:5px 14px;border-radius:9999px;font-size:13px;cursor:pointer;border:1.2px solid var(--card-border);background:transparent;color:var(--text-muted);transition:all .2s}
.filter.active,.filter:hover{border-color:var(--emerald-border);color:var(--emerald);background:var(--emerald-light)}
/* Message Cards */
.msg-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:24px;padding:20px;margin-bottom:12px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden;box-shadow:var(--card-shadow);backdrop-filter:blur(16px)}
.msg-card::before{content:'';position:absolute;top:0;left:7%;right:7%;height:2px;background:linear-gradient(90deg,transparent,rgba(122,233,193,0.45),rgba(122,233,193,0.75),rgba(122,233,193,0.45),transparent);opacity:0;transition:opacity .25s}
.msg-card:hover{transform:translateY(-4px);border-color:var(--card-border-hover)}.msg-card:hover::before{opacity:1}
.msg-card.active{border-color:var(--emerald-border);box-shadow:0 2px 12px rgba(5,150,105,.15)}
.msg-card.active::before{opacity:1}
.msg-card.sent{opacity:.5}
.msg-card.sent .msg-status-sent{display:inline-flex}
.msg-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.msg-tenant{font-weight:600;font-size:15px;color:var(--text-heading)}
.msg-time{font-size:12px;color:var(--text-muted)}
.msg-meta{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.msg-unit{font-size:12px;color:var(--text-muted)}
.badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.badge-maintenance{background:rgba(202,138,4,0.15);color:#CA8A04}
.badge-rent{background:rgba(236,72,153,0.15);color:#EC4899}
.badge-lease{background:rgba(99,102,241,0.15);color:#818CF8}
.msg-preview{font-size:14px;color:var(--text-muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.msg-status-sent{display:none;align-items:center;gap:4px;font-size:12px;color:var(--emerald);font-weight:600;margin-top:8px}
.msg-status-sent svg{width:14px;height:14px}
/* Detail Panel */
.detail{width:480px;flex-shrink:0;position:sticky;top:80px;align-self:flex-start}
.detail-empty{background:var(--card-bg);border:1px solid var(--card-border);border-radius:24px;padding:60px 40px;text-align:center;color:var(--text-muted);box-shadow:var(--card-shadow);backdrop-filter:blur(16px)}
.detail-panel{background:var(--card-bg);border:1px solid var(--card-border);border-radius:24px;overflow:hidden;box-shadow:var(--card-shadow);backdrop-filter:blur(16px);position:relative}
.detail-panel::before{content:'';position:absolute;top:0;left:7%;right:7%;height:2px;background:linear-gradient(90deg,transparent,rgba(122,233,193,0.45),rgba(122,233,193,0.75),rgba(122,233,193,0.45),transparent)}
.detail-header{padding:20px;border-bottom:1px solid var(--card-border)}
.detail-header h3{font-size:16px;font-weight:700;margin-bottom:4px;color:var(--text-heading)}
.detail-header .msg-meta{margin-bottom:0}
.detail-section{padding:20px}
.detail-section h4{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:10px;font-weight:600}
.detail-section p,.detail-section .draft-text{font-size:14px;line-height:1.7;color:var(--text-body)}
.tenant-msg-section{background:rgba(255,255,255,0.03);border-bottom:1px solid var(--card-border)}
.ai-draft-section{border-bottom:1px solid var(--card-border)}
.ai-label{display:inline-flex;align-items:center;gap:5px;background:var(--emerald-light);color:var(--emerald);padding:3px 10px;border-radius:6px;font-size:11px;font-weight:600;margin-bottom:10px}
.ai-label svg{width:14px;height:14px}
.draft-text{white-space:pre-wrap}
.draft-edit{width:100%;min-height:120px;border:1px solid var(--card-border);border-radius:12px;padding:12px;font-size:14px;line-height:1.7;font-family:'Inter',sans-serif;color:var(--text-body);resize:vertical;background:rgba(0,0,0,0.3)}
.draft-edit:focus{outline:none;border-color:var(--emerald-border)}
.detail-actions{padding:16px 20px;display:flex;gap:10px;border-top:1px solid var(--card-border)}
.detail-actions .btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px}
/* Sent overlay */
.sent-overlay{position:absolute;inset:0;background:rgba(10,15,10,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:24px;animation:fadeIn .3s}
.sent-check{width:64px;height:64px;border-radius:50%;background:var(--emerald);display:flex;align-items:center;justify-content:center;animation:popIn .4s cubic-bezier(.175,.885,.32,1.275)}
.sent-check svg{width:32px;height:32px;color:#fff}
.sent-text{margin-top:12px;font-weight:700;font-size:16px;color:var(--emerald)}
.sent-time{font-size:13px;color:var(--text-muted);margin-top:4px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{0%{transform:scale(0)}100%{transform:scale(1)}}
/* Footer */
.footer{text-align:center;padding:20px;font-size:12px;color:var(--text-muted);border-top:1px solid var(--card-border);position:relative;z-index:2}
.footer a{color:var(--emerald);text-decoration:none}
/* Responsive */
@media(max-width:900px){
  .main{flex-direction:column}
  .detail{width:100%;position:static}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:500px){
  .header{padding:10px 16px}
  .main{padding:12px 16px}
  .stats{padding:16px}
  .stat-value{font-size:22px}
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <span class="v">V</span><span class="eyra">EYRA</span>
    <span class="logo-group">GROUP</span>
  </div>
  <div class="header-right">
    <a href="https://veyragroup.ai/book" target="_blank" class="btn btn-primary btn-sm">Book a Demo</a>
    <div class="pm-name">Sarah Chen</div>
    <div class="avatar">SC</div>
  </div>
</div>

<div class="stats" id="stats"></div>

<div class="main">
  <div class="inbox">
    <div class="inbox-header">
      <div style="display:flex;align-items:center">
        <h2>Inbox</h2>
        <span class="inbox-count" id="inbox-count">10</span>
      </div>
      <div class="filters" id="filters"></div>
    </div>
    <div id="msg-list"></div>
  </div>
  <div class="detail" id="detail">
    <div class="detail-empty">
      <svg width="48" height="48" fill="none" viewBox="0 0 24 24" style="margin-bottom:12px;color:rgba(255,255,255,0.3)"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div>Select a message to view details and AI-drafted response</div>
    </div>
  </div>
</div>

<div class="footer">Powered by <a href="https://veyragroup.ai/book" target="_blank">Veyra Group</a> · Automated tenant communications</div>

<script>
const now = new Date();
function ago(mins){ return new Date(now.getTime() - mins*60000) }
function fmt(d){ return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}) + ' · ' + d.toLocaleDateString([],{month:'short',day:'numeric'}) }
function fmtShort(d){ return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}) }

const messages = [
  {id:1,tenant:"Marcus Johnson",unit:"Unit 12B",cat:"maintenance",subject:"Dishwasher Not Working",
   body:"Hi, my dishwasher stopped working last night mid-cycle. It won't drain and there's standing water at the bottom. I've tried running it again but it just makes a humming noise. Can someone come take a look? I work from home so I'm available anytime.",
   draft:"Hi Marcus,\n\nThank you for letting us know about the dishwasher issue. I'm sorry for the inconvenience.\n\nI've submitted a maintenance work order (#WO-4821) for your unit. Our maintenance team will be in touch within 24 hours to schedule a visit. Since you work from home, we'll coordinate a time that works for you.\n\nIn the meantime, please avoid running the dishwasher to prevent any overflow. If you notice any water leaking onto the floor, please let us know immediately.\n\nBest regards,\nSarah Chen\nOakwood Apartments Management",
   time:ago(12)},
  {id:2,tenant:"Lisa Park",unit:"Unit 7A",cat:"rent",subject:"Late Payment — Car Repair Emergency",
   body:"Sarah, I know my rent was due on the 1st and I'm really sorry. My car broke down last week and the repair was $1,400 which wiped out my savings. I get paid on the 20th and can pay the full amount then. Is there any way to waive the late fee? I've never been late before in 2 years.",
   draft:"Hi Lisa,\n\nThank you for reaching out and for being upfront about the situation. I understand unexpected expenses can be stressful, and I appreciate that you've been a reliable tenant for the past two years.\n\nPer our lease agreement, a late fee of $50 applies after a 5-day grace period. Given your excellent payment history, I'd like to offer the following: if we receive full payment by the 20th as you mentioned, I'll waive the late fee this one time as a courtesy.\n\nPlease confirm you'll be able to make the payment by then, and I'll note your account accordingly.\n\nBest regards,\nSarah Chen\nOakwood Apartments Management",
   time:ago(34)},
  {id:3,tenant:"David Kim",unit:"Unit 22C",cat:"maintenance",subject:"Leaky Faucet in Kitchen",
   body:"Hey there, the kitchen faucet has been dripping nonstop for about 3 days now. It's getting worse — started as a slow drip and now it's a pretty steady stream when the handle is fully off. My water bill is going to be insane. Please send someone ASAP.",
   draft:"Hi David,\n\nThank you for reporting the leaky faucet — I apologize that it's been going on for a few days. I've flagged this as a priority maintenance request (#WO-4822) since ongoing leaks can cause water damage and increased utility costs.\n\nOur maintenance technician, Mike, will reach out to you today to schedule a same-day or next-day repair. As a reminder, Oakwood covers all plumbing repair costs as part of your lease.\n\nRegarding your water bill — please save your next statement and if there's a noticeable spike, we'll work with you to make it right.\n\nBest regards,\nSarah Chen\nOakwood Apartments Management",
   time:ago(58)},
  {id:4,tenant:"Amara Okafor",unit:"Unit 31D",cat:"lease",subject:"Lease Renewal Question",
   body:"Hi Sarah, my lease is coming up for renewal on April 1st. I'd like to stay but wanted to ask — will there be a rent increase? Also, is it possible to switch to a month-to-month arrangement instead of another 12-month lease? My job situation might change later this year. Thanks!",
   draft:"Hi Amara,\n\nGreat to hear you're interested in staying at Oakwood! We'd love to keep you as a tenant.\n\nFor your April renewal, here are the details:\n\n• 12-month renewal: Your current rate of $1,650/mo would increase to $1,700/mo (a 3% adjustment in line with market rates).\n• Month-to-month option: We do offer this at a premium rate of $1,850/mo, which gives you the flexibility you're looking for.\n\nI'd recommend the 12-month renewal for the best value, but I completely understand wanting flexibility. You're welcome to start with month-to-month and convert to a full lease anytime.\n\nWould you like to schedule a quick call to discuss? I'm happy to walk through the options.\n\nBest regards,\nSarah Chen\nOakwood Apartments Management",
   time:ago(95)},
  {id:5,tenant:"James Wright",unit:"Unit 5E",cat:"maintenance",subject:"AC Not Cooling",
   body:"The AC in my apartment isn't blowing cold air anymore. It turns on and the fan runs but the air coming out is room temperature. It's been 85 degrees this week and my apartment is unbearable. I have a toddler at home so this is kind of urgent. Thanks.",
   draft:"Hi James,\n\nI'm sorry to hear about the AC issue — especially with a little one at home. I completely understand the urgency.\n\nI've submitted an emergency maintenance request (#WO-4823) and our HVAC technician will be out today to diagnose and repair the unit. We'll aim for a morning visit if possible.\n\nIn the meantime, we have two portable AC units available for loan from the leasing office. Would you like me to have one brought up to your unit this afternoon? No charge, of course.\n\nPlease let me know if the situation worsens or if you have any other concerns.\n\nBest regards,\nSarah Chen\nOakwood Apartments Management",
   time:ago(142)},
  {id:6,tenant:"Rachel Torres",unit:"Unit 18F",cat:"rent",subject:"Payment Plan Request",
   body:"Hi, I recently had some medical bills and I'm struggling to keep up with rent. I don't want to fall behind but I honestly can't pay the full $1,550 right now. Is there any kind of payment plan we could work out for the next couple months? I really love living here and don't want to have to move.",
   draft:"Hi Rachel,\n\nThank you for reaching out — I appreciate your honesty, and I want to help you stay at Oakwood.\n\nWe do offer short-term payment arrangements for tenants in good standing. Here's what I can propose:\n\n• Month 1: $775 due by the 1st, remaining $775 due by the 15th\n• Month 2: Same split arrangement\n• Month 3: Resume normal full payment schedule\n\nThis arrangement would require a signed payment agreement addendum. No additional late fees would apply as long as each installment is received on time.\n\nWould you like to come by the office this week to review and sign the agreement? I'm available Monday through Friday, 9am–5pm.\n\nBest regards,\nSarah Chen\nOakwood Apartments Management",
   time:ago(200)},
  {id:7,tenant:"Chris Nolan",unit:"Unit 40A",cat:"maintenance",subject:"Parking Lot Light Out",
   body:"Just wanted to report that the light in the south parking lot near spaces 38-42 has been out for about a week. It's really dark at night and my girlfriend doesn't feel safe walking to her car. Figured you guys might not know about it yet.",
   draft:"Hi Chris,\n\nThank you for reporting this — safety is our top priority, and I appreciate you bringing it to our attention.\n\nI've submitted a facilities work order (#WO-4824) for the south parking lot light. Our electrician is scheduled for routine visits this week and I've added this as a priority item. We expect it to be resolved within 2-3 business days.\n\nIn the meantime, I've asked our evening maintenance staff to set up a temporary portable light in that area starting tonight.\n\nPlease don't hesitate to report any other safety concerns — we want all residents and guests to feel secure on the property.\n\nBest regards,\nSarah Chen\nOakwood Apartments Management",
   time:ago(310)},
  {id:8,tenant:"Priya Sharma",unit:"Unit 9B",cat:"rent",subject:"Rent Increase Question",
   body:"Hi Sarah, I just received the notice about the rent increase effective June 1st. Can you help me understand why it's going up $125? That's almost an 8% increase and I'm a bit shocked honestly. Is there any room for negotiation? I've been here for 3 years and always pay on time.",
   draft:"Hi Priya,\n\nThank you for reaching out, and I understand your concern about the increase. I value you as a long-term tenant, and I want to be transparent about this.\n\nThe adjustment reflects several factors: increased property taxes (up 6% this year), rising insurance costs, and recent building improvements including the new fitness center and lobby renovation. That said, our new rate of $1,675/mo is still below the current market average of $1,750 for comparable 1BR units in the Denver area.\n\nGiven your excellent 3-year track record, I'd like to offer a loyalty adjustment: $1,650/mo (a $25 reduction from the proposed increase) if you sign a 14-month lease. This locks in your rate through August of next year.\n\nWould you like to discuss further? I'm happy to meet in person or hop on a call.\n\nBest regards,\nSarah Chen\nOakwood Apartments Management",
   time:ago(420)},
  {id:9,tenant:"Tyler Brooks",unit:"Unit 28C",cat:"lease",subject:"60-Day Move-Out Notice",
   body:"Hi Sarah, I'm writing to give my official 60-day notice to vacate. My last day will be April 15th. I've accepted a job in Seattle and need to relocate. Can you let me know what the move-out process looks like and how I get my security deposit back? Thanks for everything — I've really enjoyed living here.",
   draft:"Hi Tyler,\n\nCongratulations on the new opportunity in Seattle! While we're sad to see you go, we wish you all the best.\n\nI've noted your move-out date as April 15th. Here's what to expect:\n\n1. **Pre-move-out inspection:** We'll schedule a walkthrough 2 weeks before your move-out date to identify any items that need attention.\n2. **Move-out day:** Return all keys, fobs, and parking passes to the leasing office by 5pm.\n3. **Final inspection:** Conducted within 48 hours of move-out.\n4. **Security deposit:** Per Colorado law, your $1,550 deposit will be returned (minus any deductions) within 30 days via mail to your forwarding address.\n\nPlease review the attached move-out checklist to maximize your deposit return. Standard cleaning and nail hole patching goes a long way!\n\nFeel free to reach out with any questions as the date approaches.\n\nBest regards,\nSarah Chen\nOakwood Apartments Management",
   time:ago(500)},
  {id:10,tenant:"Maria Gonzalez",unit:"Unit 14A",cat:"lease",subject:"Pet Policy Question",
   body:"Hello! My daughter is moving back home temporarily and she has a cat. I checked my lease but couldn't find clear info about the pet policy. Is there a pet deposit? Are cats allowed? She'd only be staying about 6 months. The cat is an indoor cat, spayed, and very well-behaved. Let me know what we need to do. Thank you!",
   draft:"Hi Maria,\n\nGreat question! Oakwood Apartments is pet-friendly, and cats are absolutely welcome. Here's what you'll need:\n\n• **Pet deposit:** One-time refundable deposit of $300\n• **Pet rent:** $35/month added to your rent\n• **Pet application:** A brief form with your pet's vaccination records (available at the leasing office or I can email it to you)\n\nSince your daughter's stay is temporary (6 months), the pet rent would only apply during that period. The pet deposit is fully refundable upon move-out, assuming no pet-related damage.\n\nA couple of reminders from our pet policy: all cats must be kept indoors (sounds like that's already the plan!), and we require current vaccination records including rabies.\n\nWould you like me to email the pet application form? We can usually get everything processed within 2-3 business days.\n\nBest regards,\nSarah Chen\nOakwood Apartments Management",
   time:ago(580)},
];

const catColors = {maintenance:'maintenance',rent:'rent',lease:'lease'};
const catLabels = {maintenance:'Maintenance',rent:'Rent',lease:'Lease'};

let activeId = null;
let sentIds = new Set();
let editMode = {};
let activeFilter = 'all';

function renderStats(){
  const handled = sentIds.size;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-value">${messages.length}</div><div class="stat-label">Messages Today</div></div>
    <div class="stat"><div class="stat-value">${handled}</div><div class="stat-label">Handled</div></div>
    <div class="stat"><div class="stat-value">1.8 min</div><div class="stat-label">Avg Response Time</div></div>
    <div class="stat"><div class="stat-value">4.2 hrs</div><div class="stat-label">Time Saved This Week</div></div>
  `;
}

function renderFilters(){
  const cats = ['all','maintenance','rent','lease'];
  document.getElementById('filters').innerHTML = cats.map(c =>
    `<div class="filter ${activeFilter===c?'active':''}" onclick="setFilter('${c}')">${c==='all'?'All':catLabels[c]}</div>`
  ).join('');
}

function setFilter(f){ activeFilter=f; renderList(); renderFilters(); }

function renderList(){
  const filtered = activeFilter==='all' ? messages : messages.filter(m=>m.cat===activeFilter);
  document.getElementById('inbox-count').textContent = filtered.length;
  document.getElementById('msg-list').innerHTML = filtered.map(m => `
    <div class="msg-card ${m.id===activeId?'active':''} ${sentIds.has(m.id)?'sent':''}" onclick="selectMsg(${m.id})">
      <div class="msg-top">
        <span class="msg-tenant">${m.tenant}</span>
        <span class="msg-time">${fmtShort(m.time)}</span>
      </div>
      <div class="msg-meta">
        <span class="msg-unit">${m.unit} · Oakwood Apartments</span>
        <span class="badge badge-${catColors[m.cat]}">${catLabels[m.cat]}</span>
      </div>
      <div class="msg-preview">${m.subject} — ${m.body.substring(0,100)}…</div>
      <div class="msg-status-sent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg> Sent ${sentIds.has(m.id)?fmt(now):''}</div>
    </div>
  `).join('');
}

function selectMsg(id){
  activeId = id;
  renderList();
  renderDetail();
}

function renderDetail(){
  const el = document.getElementById('detail');
  if(!activeId){ el.innerHTML = `<div class="detail-empty"><svg width="48" height="48" fill="none" viewBox="0 0 24 24" style="margin-bottom:12px;color:rgba(255,255,255,0.3)"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><div>Select a message to view details</div></div>`; return; }
  const m = messages.find(x=>x.id===activeId);
  const isSent = sentIds.has(m.id);
  const isEditing = editMode[m.id];

  el.innerHTML = `
    <div class="detail-panel" style="position:relative">
      <div class="detail-header">
        <h3>${m.subject}</h3>
        <div class="msg-meta" style="margin-top:6px">
          <span class="msg-unit">${m.tenant} · ${m.unit}</span>
          <span class="badge badge-${catColors[m.cat]}">${catLabels[m.cat]}</span>
          <span class="msg-time">${fmt(m.time)}</span>
        </div>
      </div>
      <div class="detail-section tenant-msg-section">
        <h4>Tenant Message</h4>
        <p>${m.body}</p>
      </div>
      <div class="detail-section ai-draft-section">
        <div class="ai-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a4 4 0 014 4v1a1 1 0 001 1h1a4 4 0 010 8h-1a1 1 0 00-1 1v1a4 4 0 01-8 0v-1a1 1 0 00-1-1H6a4 4 0 010-8h1a1 1 0 001-1V6a4 4 0 014-4z"/></svg> AI-Drafted Response</div>
        ${isEditing
          ? `<textarea class="draft-edit" id="draft-edit-${m.id}">${m.draft}</textarea>`
          : `<div class="draft-text">${m.draft}</div>`
        }
      </div>
      ${!isSent ? `
      <div class="detail-actions">
        <button class="btn btn-green" onclick="approveDraft(${m.id})">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
          ${isEditing?'Send':'Approve & Send'}
        </button>
        <button class="btn btn-outline btn-sm" onclick="toggleEdit(${m.id})">
          ${isEditing?'Cancel':'Edit Draft'}
        </button>
      </div>` : ''}
      ${isSent ? `
      <div class="sent-overlay">
        <div class="sent-check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg></div>
        <div class="sent-text">Response Sent</div>
        <div class="sent-time">${fmt(now)}</div>
      </div>` : ''}
    </div>
  `;
}

function toggleEdit(id){
  if(editMode[id]){
    delete editMode[id];
  } else {
    editMode[id] = true;
  }
  renderDetail();
  if(editMode[id]){
    const ta = document.getElementById('draft-edit-'+id);
    if(ta) ta.focus();
  }
}

function approveDraft(id){
  if(editMode[id]){
    const ta = document.getElementById('draft-edit-'+id);
    if(ta){ const m = messages.find(x=>x.id===id); m.draft = ta.value; }
    delete editMode[id];
  }
  sentIds.add(id);
  renderStats();
  renderList();
  renderDetail();
}

renderStats();
renderFilters();
renderList();
</script>
