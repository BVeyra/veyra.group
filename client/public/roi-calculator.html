<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PM Efficiency Audit | Veyra Group</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap");
*{margin:0;padding:0;box-sizing:border-box}
:root{--emerald:#059669;--emerald-light:rgba(5,150,105,0.15);--emerald-border:rgba(5,150,105,0.5);--card-bg:linear-gradient(160deg, rgba(11,18,15,0.9), rgba(12,24,19,0.74) 50%, rgba(9,14,12,0.92));--card-border:rgba(128,205,179,0.16);--card-border-hover:rgba(128,205,179,0.28);--card-shadow:0 18px 50px rgba(0,0,0,0.35), 0 0 38px rgba(39,122,101,0.08), inset 0 1px 0 rgba(255,255,255,0.08);--text-heading:#ffffff;--text-body:rgba(255,255,255,0.7);--text-muted:rgba(255,255,255,0.5);--bg:#0a0f0a}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text-body);line-height:1.6;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 50% -20%, rgba(5,150,105,0.08), transparent),repeating-linear-gradient(0deg,transparent,transparent 95px,rgba(65,159,132,0.009) 95px,rgba(65,159,132,0.009) 96px),repeating-linear-gradient(90deg,transparent,transparent 95px,rgba(65,159,132,0.009) 95px,rgba(65,159,132,0.009) 96px);pointer-events:none;z-index:0}
.container{max-width:640px;margin:0 auto;padding:20px;position:relative;z-index:2}
.progress-bar{height:4px;background:rgba(255,255,255,0.08);border-radius:2px;margin-bottom:40px;overflow:hidden}
.progress-fill{height:100%;background:var(--emerald);border-radius:2px;transition:width .5s ease}
.logo{text-align:center;margin-bottom:32px;font-size:14px;letter-spacing:1px}
.logo .v{color:var(--emerald);font-weight:800;letter-spacing:2px}.logo .eyra{color:#fff;font-weight:800;letter-spacing:2px}
.logo .group{color:rgba(255,255,255,0.4);font-weight:400;letter-spacing:3px;margin-left:8px}
.step{display:none;animation:fadeIn .4s ease}
.step.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.step-label{font-size:13px;color:var(--text-muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.question{font-size:24px;font-weight:700;color:var(--text-heading);margin-bottom:32px;line-height:1.3}
.slider-container{margin-bottom:24px}
.slider-value{font-size:48px;font-weight:800;color:var(--emerald);text-align:center;margin-bottom:16px}
input[type=range]{-webkit-appearance:none;width:100%;height:6px;background:rgba(255,255,255,0.1);border-radius:3px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;background:var(--emerald);border-radius:50%;cursor:pointer;box-shadow:0 2px 6px rgba(5,150,105,.4)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;background:var(--emerald);border-radius:50%;cursor:pointer;border:none}
.options{display:flex;flex-direction:column;gap:10px}
.option{padding:14px 18px;border:1px solid var(--card-border);border-radius:16px;cursor:pointer;transition:all .2s;font-size:15px;background:var(--card-bg);backdrop-filter:blur(16px);color:var(--text-body)}
.option:hover{border-color:var(--emerald-border);color:var(--emerald)}
.option.selected{border-color:var(--emerald-border);background:var(--emerald-light);color:var(--emerald);font-weight:600}
.checkboxes .option{display:flex;align-items:center;gap:10px}
.checkboxes .option .check{width:20px;height:20px;border:2px solid var(--card-border);border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
.checkboxes .option.selected .check{background:var(--emerald);border-color:var(--emerald)}
.checkboxes .option.selected .check::after{content:'✓';color:#fff;font-size:13px;font-weight:700}
.btn{display:inline-block;background:linear-gradient(180deg, rgba(16,45,34,0.72), rgba(8,20,15,0.78));color:var(--emerald);border:1.2px solid var(--emerald-border);padding:14px 32px;border-radius:9999px;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s;width:100%;text-align:center;margin-top:16px;font-family:'Inter',sans-serif}
.btn:hover{color:#fff;transform:translateY(-1px);box-shadow:0 4px 12px rgba(5,150,105,.3)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.email-section{text-align:center}
.email-section .question{font-size:22px}
.email-input{width:100%;padding:14px 18px;border:1px solid var(--card-border);border-radius:16px;font-size:16px;outline:none;transition:border .2s;background:rgba(0,0,0,0.3);color:var(--text-heading);font-family:'Inter',sans-serif}
.email-input:focus{border-color:var(--emerald-border)}
.email-input::placeholder{color:var(--text-muted)}
.email-note{font-size:13px;color:var(--text-muted);margin-top:10px}
/* Results */
.results{animation:fadeIn .5s ease}
.results-header{text-align:center;margin-bottom:36px}
.results-header h1{font-size:28px;font-weight:800;color:var(--text-heading);margin-bottom:6px}
.results-header p{color:var(--text-muted);font-size:15px}
.card{background:var(--card-bg);border-radius:24px;padding:24px;margin-bottom:20px;box-shadow:var(--card-shadow);border:1px solid var(--card-border);backdrop-filter:blur(16px);animation:cardIn .5s ease both;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:7%;right:7%;height:2px;background:linear-gradient(90deg,transparent,rgba(122,233,193,0.45),rgba(122,233,193,0.75),rgba(122,233,193,0.45),transparent)}
@keyframes cardIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.card:nth-child(2){animation-delay:.1s}.card:nth-child(3){animation-delay:.2s}.card:nth-child(4){animation-delay:.3s}.card:nth-child(5){animation-delay:.4s}
.card-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin-bottom:10px;font-weight:600}
.card h3{font-size:18px;font-weight:700;margin-bottom:12px;color:var(--text-heading)}
.badge{display:inline-block;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700}
.badge.green{background:rgba(5,150,105,0.15);color:#34D399}.badge.yellow{background:rgba(202,138,4,0.15);color:#FBBF24}.badge.orange{background:rgba(234,88,12,0.15);color:#FB923C}.badge.red{background:rgba(220,38,38,0.15);color:#F87171}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--card-border)}
.stat-row:last-child{border:none}
.stat-label{color:var(--text-muted);font-size:14px}
.stat-value{font-weight:700;font-size:15px;color:var(--text-heading)}
.insight{background:rgba(5,150,105,0.08);border-radius:12px;padding:14px 16px;margin-top:14px;font-size:14px;color:var(--text-body);line-height:1.5;border-left:3px solid var(--emerald)}
.money{font-size:28px;font-weight:800;color:var(--emerald);margin:8px 0}
.rec-list{list-style:none;padding:0}
.rec-list li{padding:10px 0;border-bottom:1px solid var(--card-border);font-size:14px;display:flex;gap:10px;align-items:flex-start;color:var(--text-body)}
.rec-list li:last-child{border:none}
.rec-list li::before{content:'→';color:var(--emerald);font-weight:700;flex-shrink:0}
.cta-section{text-align:center;background:linear-gradient(160deg, rgba(5,150,105,0.2), rgba(5,150,105,0.08));border:1px solid var(--emerald-border);border-radius:24px;padding:32px 24px;margin-top:24px;position:relative;overflow:hidden}
.cta-section::before{content:'';position:absolute;top:0;left:7%;right:7%;height:2px;background:linear-gradient(90deg,transparent,rgba(122,233,193,0.45),rgba(122,233,193,0.75),rgba(122,233,193,0.45),transparent)}
.cta-section h3{font-size:20px;font-weight:700;margin-bottom:8px;color:var(--text-heading)}
.cta-section p{color:var(--text-body);font-size:14px;margin-bottom:20px}
.btn-white{background:var(--emerald);color:#fff;padding:14px 32px;border:none;border-radius:9999px;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s;text-decoration:none;display:inline-block;font-family:'Inter',sans-serif}
.btn-white:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(5,150,105,.4)}
.cta-note{font-size:12px;color:var(--text-muted);margin-top:12px}
</style>
</head>
<body>
<div class="container">
<div class="logo"><span class="v">V</span><span class="eyra">EYRA</span><span class="group">GROUP</span></div>
<div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
<div id="app"></div>
</div>
<script>
const state={step:0,units:50,team:2,response:'',vacancy:'',afterhours:'',painpoints:[],email:''};
const responseOptions=['Under 30 min','1-2 hours','3-6 hours','Same day','Next day or later'];
const vacancyOptions=['Under 2 weeks','2-4 weeks','1-2 months','2+ months','Not sure'];
const afterhoursOptions=['I respond personally','Team member on call','They wait until morning','Answering service','Automated system'];
const painOptions=['Tenant communications','Maintenance coordination','Lease renewals','Rent collection','Prospect response time','Owner reporting','All of the above'];

function render(){
const app=document.getElementById('app');
const progress=document.getElementById('progress');
const totalSteps=8;
progress.style.width=`${(state.step/totalSteps)*100}%`;

if(state.step===0){app.innerHTML=`
<div class="step active">
<div class="step-label">Question 1 of 6</div>
<div class="question">How many rental units do you manage?</div>
<div class="slider-container">
<div class="slider-value" id="sv">${state.units}</div>
<input type="range" min="5" max="500" value="${state.units}" oninput="state.units=+this.value;document.getElementById('sv').textContent=this.value">
</div>
<button class="btn" onclick="next()">Continue</button>
</div>`}
else if(state.step===1){app.innerHTML=`
<div class="step active">
<div class="step-label">Question 2 of 6</div>
<div class="question">How many people are on your team (including you)?</div>
<div class="slider-container">
<div class="slider-value" id="tv">${state.team}</div>
<input type="range" min="1" max="20" value="${state.team}" oninput="state.team=+this.value;document.getElementById('tv').textContent=this.value">
</div>
<button class="btn" onclick="next()">Continue</button>
</div>`}
else if(state.step===2){renderSelect('Question 3 of 6','When a prospective tenant inquires, how quickly do you typically respond?',responseOptions,'response')}
else if(state.step===3){renderSelect('Question 4 of 6',"What's your average vacancy time between tenants?",vacancyOptions,'vacancy')}
else if(state.step===4){renderSelect('Question 5 of 6','How do you handle after-hours tenant messages?',afterhoursOptions,'afterhours')}
else if(state.step===5){
app.innerHTML=`
<div class="step active">
<div class="step-label">Question 6 of 6</div>
<div class="question">What's your biggest operational headache?</div>
<div class="options checkboxes">${painOptions.map(o=>`<div class="option ${state.painpoints.includes(o)?'selected':''}" onclick="togglePain('${o}')"><div class="check"></div>${o}</div>`).join('')}</div>
<button class="btn" ${state.painpoints.length===0?'disabled':''} onclick="next()">Continue</button>
</div>`}
else if(state.step===6){
app.innerHTML=`
<div class="step active email-section">
<div class="question">Your audit results are ready.<br>Where should we send them?</div>
<input class="email-input" type="email" placeholder="you@company.com" value="${state.email}" oninput="state.email=this.value;document.getElementById('eb').disabled=!this.value.includes('@')">
<button class="btn" id="eb" ${!state.email.includes('@')?'disabled':''} onclick="next()">Get My Audit Results</button>
<div class="email-note">We'll also include 3 specific recommendations for your portfolio size.</div>
</div>`}
else if(state.step===7){renderResults()}
}

function renderSelect(label,q,opts,key){
const app=document.getElementById('app');
app.innerHTML=`
<div class="step active">
<div class="step-label">${label}</div>
<div class="question">${q}</div>
<div class="options">${opts.map(o=>`<div class="option ${state[key]===o?'selected':''}" onclick="state['${key}']='${o}';next()">${o}</div>`).join('')}</div>
</div>`;
}

function togglePain(p){
if(p==='All of the above'){state.painpoints=state.painpoints.includes(p)?[]:[...painOptions]}
else{const i=state.painpoints.indexOf(p);if(i>-1)state.painpoints.splice(i,1);else state.painpoints.push(p);state.painpoints=state.painpoints.filter(x=>x!=='All of the above')}
render();
}

function next(){state.step++;render();window.scrollTo({top:0,behavior:'smooth'})}

function renderResults(){
const app=document.getElementById('app');
const ratio=Math.round(state.units/state.team);
const ri=responseOptions.indexOf(state.response);
const rScores=[
{label:'Elite — Top 5% of PMs',cls:'green',msg:'You\'re in rare company. Most PMs take hours to respond to prospects.'},
{label:'Good — but you\'re losing some prospects',cls:'yellow',msg:'You\'re ahead of most, but prospects reaching out to multiple PMs often go with whoever responds first.'},
{label:'At Risk — 78% of tenants go with the first PM to respond',cls:'orange',msg:'At this speed, faster competitors are likely converting your prospects before you even reply.'},
{label:'Critical — you\'re likely losing 3-5 prospects per vacancy',cls:'red',msg:'Same-day response means most interested renters have already moved on to another listing.'},
{label:'Critical — you\'re likely losing 3-5 prospects per vacancy',cls:'red',msg:'By the next day, the best tenants have already signed elsewhere. Speed is the #1 factor.'}
];
const rs=rScores[ri]||rScores[4];

let capLabel,capNote='';
if(ratio<50){capLabel='Well-Staffed';capNote='You have room to grow your portfolio without adding headcount.'}
else if(ratio<75){capLabel='Industry Typical';capNote='You\'re in the standard range. Automation could free up 8-12 hours per week for growth activities.'}
else if(ratio<100){capLabel='Stretched Thin';capNote='Companies at your ratio typically spend 60%+ of their time on reactive tasks instead of growing the portfolio.'}
else{capLabel='Burnout Zone';capNote='At this ratio, dropped balls and tenant churn become almost inevitable. Something has to give.'}

const vacDays={0:10,1:21,2:45,3:75,4:30};
const vd=vacDays[vacancyOptions.indexOf(state.vacancy)]||30;
const turnover=state.units<50?.45:state.units<100?.40:.35;
const annualTurns=Math.round(state.units*turnover);
const annualVacCost=Math.round(annualTurns*vd*47);
const low=Math.round(annualVacCost*.85);const high=Math.round(annualVacCost*1.15);
const speedSavings=ri>=2?Math.round(7*47):0;

const recs=[];const pp=state.painpoints;const allP=pp.includes('All of the above');
if(allP||pp.includes('Tenant communications')||pp.includes('Prospect response time'))
recs.push({title:'AI-Powered Instant Response',desc:`Respond to every prospect inquiry in under 60 seconds, 24/7 — even at 2 AM. For ${state.units} units, this alone could cut vacancy by 5-10 days per turn.`});
if(allP||pp.includes('Maintenance coordination'))
recs.push({title:'Smart Maintenance Triage',desc:'Automatically categorize, prioritize, and route maintenance requests to the right vendor — no more playing phone tag.'});
if(allP||pp.includes('Lease renewals'))
recs.push({title:'Automated Renewal Pipeline',desc:`Start the renewal conversation 90 days out, automatically. At your turnover rate, keeping even 2-3 more tenants/year saves $${(vd*47*2.5).toLocaleString()}.`});
if(allP||pp.includes('Rent collection'))
recs.push({title:'Proactive Payment Reminders',desc:'Automated reminders before rent is due — not after. PMs using this see late payments drop by 35-50%.'});
if(allP||pp.includes('Owner reporting'))
recs.push({title:'Automated Owner Updates',desc:'Generate and send owner reports automatically. No more spending Sunday nights on spreadsheets.'});
if(recs.length===0)
recs.push({title:'Workflow Automation',desc:`At ${ratio} units per person, automating repetitive tasks could free up 10+ hours per week for your team.`});

const timeSaved=ratio>=75?'15-20':ratio>=50?'10-15':'8-12';

app.innerHTML=`
<div class="results">
<div class="results-header">
<h1>Your PM Efficiency Audit</h1>
<p>${state.units} units · ${state.team} team member${state.team>1?'s':''}</p>
</div>
<div class="card">
<div class="card-label">Response Speed Score</div>
<h3><span class="badge ${rs.cls}">${rs.label}</span></h3>
<p style="margin-top:12px;font-size:14px;color:var(--text-body)">${rs.msg}</p>
<div class="insight">📊 MIT research shows responding within 5 minutes makes you 21x more likely to qualify a lead vs. 30 minutes.<br><small style="color:var(--text-muted)">Source: MIT/InsideSales.com Lead Response Study</small></div>
</div>
<div class="card">
<div class="card-label">Capacity Analysis</div>
<h3>You're managing <span style="color:var(--emerald)">${ratio} units per team member</span></h3>
<div class="stat-row"><span class="stat-label">Your ratio</span><span class="stat-value">${ratio}:1</span></div>
<div class="stat-row"><span class="stat-label">Category</span><span class="stat-value">${capLabel}</span></div>
<div class="stat-row"><span class="stat-label">Industry benchmark</span><span class="stat-value">50-75 typical</span></div>
<p style="margin-top:12px;font-size:14px;color:var(--text-body)">${capNote}</p>
</div>
<div class="card">
<div class="card-label">Revenue Leak Estimate</div>
<h3>Estimated annual vacancy cost</h3>
<div class="money">$${low.toLocaleString()} – $${high.toLocaleString()}</div>
<div class="stat-row"><span class="stat-label">Avg vacancy period</span><span class="stat-value">~${vd} days</span></div>
<div class="stat-row"><span class="stat-label">Est. annual turns</span><span class="stat-value">${annualTurns} units</span></div>
<div class="stat-row"><span class="stat-label">Daily vacancy cost</span><span class="stat-value">~$47/unit</span></div>
${speedSavings?`<div class="insight">⚡ Faster prospect response could reduce your vacancy by 5-10 days per turn — that's <strong>$${(speedSavings).toLocaleString()} per unit saved</strong>.</div>`:''}
<p style="margin-top:10px;font-size:12px;color:var(--text-muted)">Based on $1,400/mo national median rent (Census/Zillow) and NARPM turnover benchmarks.</p>
</div>
<div class="card">
<div class="card-label">Your Automation Opportunity</div>
<h3>Recommended for your portfolio</h3>
<ul class="rec-list">${recs.map(r=>`<li><div><strong style="color:var(--text-heading)">${r.title}</strong><br><span style="color:var(--text-muted)">${r.desc}</span></div></li>`).join('')}</ul>
<div class="insight">📈 PMs your size who automate tenant comms typically handle 30-40% more units without adding staff. Estimated time savings: <strong>${timeSaved} hours/week</strong>.</div>
</div>
<div class="cta-section">
<h3>Want to see exactly how this works for ${state.units} units?</h3>
<p>We'll map your current workflow and show you where the hours are hiding.</p>
<a href="https://veyragroup.ai/book" class="btn-white">Book Your Free 15-Minute Workflow Audit</a>
<div class="cta-note">No pitch. Just your workflow, mapped and optimized.</div>
</div>
</div>`;
}

render();
</script>
</body>
</html>
