<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" width="560" height="230" role="img" aria-labelledby="title desc">
  <title id="title">Veyra Group logo white</title>
  <desc id="desc">Wordmark with V in emerald and remaining letters in white.</desc>
  <defs>
    <linearGradient id="vGradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d8ab"/>
      <stop offset="100%" stop-color="#24bf95"/>
    </linearGradient>
  </defs>
  <g font-family="Inter, Plus Jakarta Sans, system-ui, -apple-system, Segoe UI, sans-serif" letter-spacing="-0.02em">
    <text x="56" y="120" font-size="106" font-weight="800" fill="url(#vGradWhite)">V</text>
    <text x="122" y="120" font-size="106" font-weight="800" fill="#ffffff">EYRA</text>
    <text x="117" y="196" font-size="86" font-weight="500" fill="#ffffff">GROUP</text>
  </g>
</svg>
