<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Veyra Logo Export</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 100px;
      background: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 80px;
    }
    .logo {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .logo-large {
      font-size: 120px;
    }
    .logo-medium {
      font-size: 72px;
    }
    .logo-small {
      font-size: 48px;
    }
    .veyra {
      color: #0F172A;
    }
    .group {
      color: #0891B2;
    }
    .dark-bg {
      background: #0F172A;
      padding: 40px 60px;
      border-radius: 12px;
    }
    .dark-bg .veyra {
      color: #FFFFFF;
    }
    .label {
      font-family: sans-serif;
      font-size: 14px;
      color: #666;
      margin-bottom: 20px;
    }
    .section {
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="section">
    <div class="label">Large - Light Background</div>
    <div class="logo logo-large"><span class="veyra">VEYRA</span><span class="group">GROUP</span></div>
  </div>
  
  <div class="section">
    <div class="label">Large - Dark Background</div>
    <div class="dark-bg">
      <div class="logo logo-large"><span class="veyra">VEYRA</span><span class="group">GROUP</span></div>
    </div>
  </div>
  
  <div class="section">
    <div class="label">Medium</div>
    <div class="logo logo-medium"><span class="veyra">VEYRA</span><span class="group">GROUP</span></div>
  </div>
  
  <div class="section">
    <div class="label">Small</div>
    <div class="logo logo-small"><span class="veyra">VEYRA</span><span class="group">GROUP</span></div>
  </div>
</body>
</html>
